version: "3.9"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_PORT: 4533
      ND_SCANINTERVAL: 1m
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ${DWE_NAVIDROME_DATA_DIR:-/srv/dwe/navidrome/data}:/data
      - ${DWE_MUSIC_DIR:-/srv/dwe/music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4533/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dwe_backend
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
    environment:
      # Settings read from .env or host environment variables.
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${NAVIDROME_USER:-admin}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-admin}
      - DWE_MUSIC_DIR=${DWE_MUSIC_DIR:-/srv/dwe/music}
    volumes:
      - ./:/app:ro
    ports:
      - "8000:8000"
