services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_PORT: 4533
      # Enable Subsonic API compatibility required by backend client
      ND_SUBSONIC: "true"
      ND_SUBSONIC_API_VERSION: "1.16.1"
      # Enable legacy routing so that /rest/getSongs and other Subsonic endpoints are available
      ND_SUBSONIC_ROUTING: "legacy"
      ND_SCANINTERVAL: 1m
      ND_SESSIONTIMEOUT: 24h
      # Explicit admin credentials for Subsonic API authentication
      ND_ADMIN_USER: "${NAVIDROME_USER:-admin}"
      ND_ADMIN_PASSWORD: "${NAVIDROME_PASSWORD:-admin}"
    volumes:
      - ${DWE_NAVIDROME_DATA_DIR:-/srv/dwe/navidrome/data}:/data
      - ${DWE_MUSIC_DIR:-/srv/dwe/music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4533/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dwe_backend
    restart: unless-stopped
    depends_on:
      navidrome:
        condition: service_healthy
    environment:
      # Settings read from .env or host environment variables.
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${NAVIDROME_USER:-admin}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-admin}
      - DWE_MUSIC_DIR=${DWE_MUSIC_DIR:-/srv/dwe/music}
    volumes:
      - ./:/app:ro
    ports:
      - "8000:8000"

  # テスト実行用サービス（Docker 上で pytest を走らせる）
  # CI やローカル開発時に `docker compose run --rm test` で実行できる
  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      navidrome:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${NAVIDROME_USER:-admin}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-admin}
      - DWE_MUSIC_DIR=${DWE_MUSIC_DIR:-/srv/dwe/music}
      - PLAYWRIGHT_BROWSERS_PATH=/home/appuser/.cache/ms-playwright
    # Mount source code as read‑write for lint/fix operations.
    volumes:
      - ./:/app
    # Ensure the test container can resolve the backend service name used in the UI.
    # Map "backend" to the Docker host gateway IP, which forwards to the published
    # port 8000. This works across Linux, macOS and Windows Docker setups.
    extra_hosts:
      - "backend:host-gateway"
    command: ["pytest", "-q"]

  lyrics:
    build:
      context: .
      dockerfile: lyrics/Dockerfile
    container_name: dwe_lyrics
    restart: "no"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-en}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      DWE_MUSIC_DIR: /music
      DWE_LYRICS_DIR: /music
      FORCE: ${FORCE:-false}
      DRY_RUN: ${DRY_RUN:-false}
      # Enable VAD filter to suppress repeated output on silent tails.
      WHISPER_VAD_FILTER: "true"
      WHISPER_VAD_THRESHOLD: "0.5"
    volumes:
      - ${DWE_MUSIC_DIR:-/srv/dwe/music}:/music
      # Mount the source code into the package directory to allow live edits without overwriting the app root.
      - ./lyrics:/app/lyrics
      # Bind‑mount a host directory for model cache (ensure it exists locally).
      - ./model_cache:/models
    working_dir: /app
    command: ["python", "-m", "lyrics"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

