[pytest]
# pytest の設定。
# tests/test_playwright.py は pytest-playwright の page fixture と
# @pytest.mark.playwright を使う。マーカーを登録することで
# PytestUnknownMarkWarning を解消し、CI で `-m "not playwright"` による
# 選別実行（live backend 不要のユニットテストのみ）が可能になる。
markers =
    playwright: Playwright を使う E2E テスト。live backend と frontend/dist が必要。

# 収集対象を tests/ に固定する（Docker コンテナ内の /app から実行される）。
testpaths = tests
